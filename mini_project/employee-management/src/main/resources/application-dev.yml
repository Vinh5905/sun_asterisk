spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/employee_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:employee_user}
    password: ${DB_PASSWORD:employee_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    com.sunasterisk.employeemanagement: DEBUG
