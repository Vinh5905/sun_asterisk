<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell">
    <nav class="nav-bar">
        <a th:href="@{/employees/list}">Employees</a>
        <a th:href="@{/employees/add}">Add</a>
        <a th:href="@{/employees/search}">Search</a>
    </nav>

    <section class="page-header">
        <h1>Employees</h1>
        <a class="button" th:href="@{/employees/add}">Add employee</a>
    </section>

    <section class="table-panel">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="employee : ${employees}">
                <td th:text="${employee.id}">1</td>
                <td th:text="${employee.name}">Employee name</td>
                <td th:text="${employee.email}">email@example.com</td>
                <td th:text="${employee.department.name}">Department</td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="4" class="empty-state">No employees found</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
