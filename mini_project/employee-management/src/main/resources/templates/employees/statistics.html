<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Statistics</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell">
    <nav class="nav-bar">
        <a th:href="@{/employees/list}">Employees</a>
        <a th:href="@{/employees/add}">Add</a>
        <a th:href="@{/employees/search}">Search</a>
        <a th:href="@{/employees/statistics}">Statistics</a>
    </nav>

    <section class="page-header">
        <h1>Employee Statistics</h1>
    </section>

    <section class="summary-panel">
        <span>Total employees</span>
        <strong th:text="${totalEmployees}">0</strong>
    </section>

    <section class="table-panel">
        <table>
            <thead>
            <tr>
                <th>Department</th>
                <th>Employees</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${employeesByDepartment}">
                <td th:text="${item.departmentName}">Department</td>
                <td th:text="${item.employeeCount}">0</td>
            </tr>
            <tr th:if="${#lists.isEmpty(employeesByDepartment)}">
                <td colspan="2" class="empty-state">No statistics found</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
