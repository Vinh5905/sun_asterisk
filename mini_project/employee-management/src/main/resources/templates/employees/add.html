<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell">
    <nav class="nav-bar">
        <a th:href="@{/employees/list}">Employees</a>
        <a th:href="@{/employees/add}">Add</a>
        <a th:href="@{/employees/search}">Search</a>
        <a th:href="@{/employees/statistics}">Statistics</a>
    </nav>

    <section class="page-header">
        <h1>Add Employee</h1>
    </section>

    <form class="form-panel" th:action="@{/employees/add}" th:object="${employeeForm}" method="post">
        <label for="name">Name</label>
        <input id="name" type="text" th:field="*{name}">
        <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</p>

        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}">
        <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</p>

        <label for="departmentId">Department</label>
        <select id="departmentId" th:field="*{departmentId}">
            <option value="">Select department</option>
            <option th:each="department : ${departments}"
                    th:value="${department.id}"
                    th:text="${department.name}">
                Department
            </option>
        </select>
        <p class="field-error" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}">
            Department error
        </p>

        <div class="form-actions">
            <a class="button secondary" th:href="@{/employees/list}">Cancel</a>
            <button class="button" type="submit">Save</button>
        </div>
    </form>
</main>
</body>
</html>
